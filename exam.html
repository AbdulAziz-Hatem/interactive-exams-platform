<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خوض الاختبار | منصة مدارج</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <a href="#question-render-area" class="sr-only">تخطي إلى السؤال الحالي</a>

  <header class="navbar" role="banner">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <span class="brand-badge">مدارج</span>
        <span id="exam-nav-brand">جلسة الاختبار</span>
      </a>

      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <!-- صندوق المؤقت التنازلي -->
        <div id="timer-box" class="timer-box" role="timer" aria-label="الوقت المتبقي للاختبار">
          <span aria-hidden="true">⏱️</span>
          <span id="timer-time">00:00</span>
        </div>
        <button id="theme-toggle" class="btn btn-secondary btn-sm" aria-label="تبديل المظهر">🌓</button>
      </div>
    </div>
  </header>

  <main id="main-content" class="container" role="main" style="margin-top: 2rem; margin-bottom: 3rem;">
    <div id="exam-app">
      
      <!-- شريط معلومات الاختبار والتقدم -->
      <header class="exam-header" aria-labelledby="exam-title">
        <div>
          <h1 id="exam-title" style="font-size: 1.4rem; font-weight: 800; margin-bottom: 0.25rem;">جاري تحميل الاختبار...</h1>
          <span style="font-size: 0.95rem; color: var(--text-muted);">
            السؤال <strong id="current-question-num">1</strong> من إجمالي <strong id="total-questions-count">...</strong>
          </span>
        </div>
      </header>

      <!-- شريط التقدم المرئي والصوتي المتاح -->
      <div 
        class="progress-bar-container" 
        role="progressbar" 
        id="exam-progress-bar-container"
        aria-label="نسبة التقدم في حل أسئلة الاختبار" 
        aria-valuemin="0" 
        aria-valuemax="100" 
        aria-valuenow="0"
      >
        <div id="exam-progress-bar" class="progress-bar" style="width: 0%;"></div>
      </div>

      <!-- منطقة عرض السؤال الحالي -->
      <div id="question-render-area" tabindex="-1">
        <div class="card" style="text-align: center; padding: 3rem;">
          <p class="text-muted">جاري إعداد الأسئلة...</p>
        </div>
      </div>

      <!-- أزرار التنقل بين الأسئلة وتسليم الاختبار -->
      <nav class="exam-nav" aria-label="التنقل بين أسئلة الاختبار">
        <button id="btn-prev" class="btn btn-secondary" disabled aria-label="الانتقال إلى السؤال السابق">
          ← السؤال السابق
        </button>

        <button id="btn-next" class="btn btn-primary" aria-label="الانتقال إلى السؤال التالي">
          السؤال التالي →
        </button>

        <button id="btn-submit-exam" class="btn btn-success" style="display: none;" aria-label="إنهاء وتسليم الاختبار">
          ✅ إنهاء وتسليم الاختبار
        </button>
      </nav>

    </div>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="container">
      <p>منصة مدارج للاختبارات التفاعلية © 2026</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/exam.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('theme-toggle').addEventListener('click', () => window.a11y.toggleTheme());
      window.examEngine.init();
    });
  </script>
</body>
</html>
