<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خوض الاختبار | قسم القرآن الكريم وعلومه — جامعة صنعاء</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <a href="#question-render-area" class="sr-only">تخطي إلى السؤال الحالي</a>

  <!-- شريط جلسة الاختبار المخصص والمحمي -->
  <header class="navbar" role="banner">
    <div class="container nav-container">
      <div class="nav-right">
        <a href="index.html" class="brand" id="btn-exit-exam" aria-label="مغادرة الاختبار والعودة للرئيسية">
          <span class="brand-badge">مدارج</span>
          <div class="brand-text-wrapper">
            <span class="brand-title" id="exam-nav-brand">جلسة الاختبار التفاعلي</span>
            <span class="brand-subtitle">قسم القرآن الكريم وعلومه — جامعة صنعاء</span>
          </div>
        </a>
      </div>

      <div class="nav-left">
        <!-- مؤقت الاختبار الصوتي والمرئي -->
        <div id="timer-box" class="timer-box" role="timer" aria-label="الوقت المتبقي للاختبار">
          <span aria-hidden="true">⏱️</span>
          <span id="timer-time">00:00</span>
        </div>
        <button id="theme-toggle" class="btn btn-secondary btn-sm" aria-label="تبديل المظهر">🌓</button>
      </div>
    </div>
  </header>

  <main id="main-content" class="container" role="main" style="margin-top: 2rem; margin-bottom: 4rem;">
    <div id="exam-app">
      
      <!-- شريط تفاصيل الاختبار وحالة التقدم -->
      <header class="exam-header" aria-labelledby="exam-title">
        <div>
          <h1 id="exam-title" style="font-size: 1.55rem; font-weight: 800; margin-bottom: 0.35rem;">جاري تحميل الاختبار من السحابة...</h1>
          <span style="font-size: 0.96rem; color: var(--text-muted); font-weight: 600;">
            السؤال <strong id="current-question-num" style="color: var(--primary);">1</strong> من إجمالي <strong id="total-questions-count">...</strong>
          </span>
        </div>
        <div>
          <span class="badge badge-primary">عشوائي: تم خلط الأسئلة والخيارات</span>
        </div>
      </header>

      <!-- شريط التقدم المرئي والصوتي المتاح -->
      <div 
        class="progress-bar-container" 
        role="progressbar" 
        id="exam-progress-bar-container"
        aria-label="نسبة التقدم في حل أسئلة الاختبار" 
        aria-valuemin="0" 
        aria-valuemax="100" 
        aria-valuenow="0"
      >
        <div id="exam-progress-bar" class="progress-bar" style="width: 0%;"></div>
      </div>

      <!-- منطقة عرض السؤال الحالي المحمية -->
      <div id="question-render-area" tabindex="-1">
        <div class="card" style="text-align: center; padding: 3.5rem;">
          <p class="text-muted">جاري سحب الأسئلة وتجهيز الجلسة...</p>
        </div>
      </div>

      <!-- أزرار التنقل وتسليم الاختبار المتاحة -->
      <nav class="exam-nav" aria-label="التنقل بين أسئلة الاختبار">
        <button id="btn-prev" class="btn btn-secondary" disabled aria-label="الانتقال إلى السؤال السابق">
          ← السؤال السابق
        </button>

        <button id="btn-next" class="btn btn-primary" aria-label="الانتقال إلى السؤال التالي">
          السؤال التالي →
        </button>

        <button id="btn-submit-exam" class="btn btn-success" style="display: none;" aria-label="إنهاء وتسليم الاختبار">
          ✅ إنهاء وتسليم الاختبار الأكاديمي
        </button>
      </nav>

    </div>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="container">
      <p>قسم القرآن الكريم وعلومه — كلية التربية، جامعة صنعاء © 2026</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="js/exam.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('theme-toggle')?.addEventListener('click', () => window.a11y?.toggleTheme());
      
      // تأكيد الخروج أثناء جلسة الاختبار لتفادي ضياع الإجابات
      document.getElementById('btn-exit-exam')?.addEventListener('click', (e) => {
        if (!confirm('تنبيه أكاديمي: هل أنت متأكد من رغبتك في مغادرة جلسة الاختبار الحالية؟ لن تُحتسب الإجابات غير المسلمة.')) {
          e.preventDefault();
        }
      });

      window.examEngine.init();
    });
  </script>
</body>
</html>
