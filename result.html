<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نتيجة الاختبار والمراجعة الأكاديمية | قسم القرآن الكريم وعلومه — جامعة صنعاء</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
  <a href="#main-content" class="sr-only">تخطي إلى المحتوى الرئيسي</a>

  <!-- شريط التنقل العلوي الأكاديمي -->
  <header class="navbar" role="banner">
    <div class="container nav-container">
      <div class="nav-right">
        <button id="hamburger-btn" class="hamburger-btn" aria-expanded="false" aria-controls="mobile-sidebar" aria-label="فتح القائمة الرئيسية">
          <span class="hamburger-bar" aria-hidden="true"></span>
          <span class="hamburger-bar" aria-hidden="true"></span>
          <span class="hamburger-bar" aria-hidden="true"></span>
        </button>
        <a href="index.html" class="brand">
          <span class="brand-badge">مدارج</span>
          <div class="brand-text-wrapper">
            <span class="brand-title">منصة مدارج</span>
            <span class="brand-subtitle">قسم القرآن الكريم وعلومه — جامعة صنعاء</span>
          </div>
        </a>
      </div>
      <div class="nav-left">
        <div id="nav-auth-container" class="desktop-only"></div>
        <button id="theme-toggle" class="btn btn-secondary btn-sm" aria-label="تبديل المظهر">🌓</button>
      </div>
    </div>
  </header>

  <!-- خلفية التعتيم والقائمة الجانبية -->
  <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>
  <aside id="mobile-sidebar" class="sidebar-drawer" role="dialog" aria-modal="true" aria-label="القائمة الجانبية للموقع" aria-hidden="true">
    <div class="sidebar-header">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <span class="brand-badge">مدارج</span>
        <span style="font-weight: 800; font-size: 1.15rem;">القائمة الرئيسية</span>
      </div>
      <button id="sidebar-close-btn" class="sidebar-close-btn" aria-label="إغلاق القائمة الجانبية">✕</button>
    </div>
    <div id="sidebar-user-area" class="sidebar-user-card"></div>
    <nav role="navigation" aria-label="روابط القائمة">
      <ul id="sidebar-nav-links" class="sidebar-nav"></ul>
    </nav>
    <div class="sidebar-footer">
      <span style="font-size: 0.8rem; color: var(--text-muted); text-align: center;">قسم القرآن الكريم وعلومه — كلية التربية © 2026</span>
    </div>
  </aside>

  <main id="main-content" class="container" role="main" style="margin-top: 2rem; margin-bottom: 4rem;">
    <div id="result-app">
      <div class="card" style="text-align: center; padding: 3.5rem;">
        <p class="text-muted">جاري احتساب النتيجة وجلب التغذية الراجعة من السحابة...</p>
      </div>
    </div>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="container">
      <p>قسم القرآن الكريم وعلومه — كلية التربية، جامعة صنعاء © 2026</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/a11y.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('theme-toggle')?.addEventListener('click', () => window.a11y?.toggleTheme());

      await window.authManager.init();
      window.db.init();

      const params = new URLSearchParams(window.location.search);
      const submissionId = params.get('submission_id');

      if (!submissionId) {
        alert('لم يتم تحديد معرف النتيجة!');
        window.location.href = 'index.html';
        return;
      }

      loadResult(submissionId);
    });

    async function loadResult(submissionId) {
      try {
        const sub = await window.db.getSubmissionById(submissionId);
        if (!sub) {
          alert('تعذر العثور على سجل النتيجة الأكاديمية!');
          window.location.href = 'index.html';
          return;
        }

        const app = document.getElementById('result-app');
        const isPassed = sub.passed;
        const bannerClass = isPassed ? 'passed' : 'failed';
        const statusText = isPassed ? 'مبارك! تم اجتياز الاختبار بنجاح 🎉' : 'للأسف لم يتم اجتياز الاختبار هذه المرة ⚠️';

        const voiceAnnounce = `تم الانتهاء من الاختبار. ${statusText}. درجتك هي: ${sub.percentage} بالمائة. حصلت على ${sub.score} من إجمالي ${sub.total_points} نقطة.`;
        window.a11y?.announce(voiceAnnounce, 'assertive');

        const details = sub.review_details || [];
        const reviewItemsHtml = details.map((d, index) => {
          const itemClass = d.is_correct ? 'correct' : 'wrong';
          const badgeHtml = d.is_correct 
            ? '<span class="badge badge-success">إجابة صحيحة ✓</span>'
            : '<span class="badge badge-danger">إجابة غير صحيحة ✗</span>';

          return `
            <article class="review-item ${itemClass}" aria-labelledby="rev-q-${index}">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; gap: 0.5rem;">
                <h4 id="rev-q-${index}" style="font-size: 1.2rem; font-weight: 800;">
                  المسألة ${index + 1}: ${window.authManager.escapeHtml(d.question_text)}
                </h4>
                ${badgeHtml}
              </div>

              <div style="margin: 0.85rem 0; font-size: 1.02rem;">
                <p style="margin-bottom: 0.35rem;">
                  <strong>الإجابة النموذجية الصحيحة:</strong> 
                  <span style="color: var(--success); font-weight: 800;">${window.authManager.escapeHtml(d.correct_choice_text)}</span>
                </p>
              </div>

              ${d.explanation ? `
                <div class="explanation-box">
                  <strong>💡 التعليل العلمي وتأصيل المسألة:</strong> ${window.authManager.escapeHtml(d.explanation)}
                </div>
              ` : ''}
            </article>
          `;
        }).join('');

        app.innerHTML = `
          <section class="result-banner ${bannerClass}" role="region" aria-label="ملخص النتيجة الأكاديمية">
            <h1 style="font-size: 2.1rem; font-weight: 900; margin-bottom: 0.5rem;">${statusText}</h1>
            <div class="score-display">${sub.percentage}%</div>
            <p style="font-size: 1.25rem; font-weight: 700;">
              الدرجة المحققة: ${sub.score} من أصل ${sub.total_points} نقطة
            </p>
            <p style="font-size: 0.95rem; margin-top: 0.5rem; opacity: 0.95;">
              درجة النجاح المقررة: ${sub.passing_percentage || 50}%
            </p>

            <div style="display: flex; justify-content: center; gap: 1rem; margin-top: 1.75rem; flex-wrap: wrap;">
              <a href="exam.html?id=${sub.exam_id}" class="btn btn-primary btn-sm">إعادة المحاولة (بترتيب عشوائي جديد) ↺</a>
              <a href="dashboard.html" class="btn btn-secondary btn-sm">سجل اختباراتي 📋</a>
              <a href="index.html#subjects-section" class="btn btn-outline btn-sm">مقررات القسم 🏠</a>
            </div>
          </section>

          <section aria-labelledby="review-section-title">
            <div class="card-header">
              <div>
                <h2 id="review-section-title" style="font-size: 1.55rem; font-weight: 800;">
                  المراجعة التأصيلية والتعليلات العلمية
                </h2>
                <p class="text-muted" style="font-size: 0.9rem; margin-top: 0.2rem;">بيان وجه الصواب وتوثيق مسائل الاختبار وفق مفردات المقرر المعتمد.</p>
              </div>
              <span class="badge badge-primary">${details.length} مسائل</span>
            </div>

            <div class="reviews-list">
              ${reviewItemsHtml || '<p class="text-muted">لا تتوفر تفاصيل مراجعة إضافية لهذا السجل.</p>'}
            </div>
          </section>
        `;

        window.a11y?.focusElement('#review-section-title');
      } catch (err) {
        console.error(err);
        alert('حدث خطأ أثناء عرض النتيجة: ' + err.message);
      }
    }
  </script>
</body>
</html>
